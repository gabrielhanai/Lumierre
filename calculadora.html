<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Calculadora</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: #1e1e2f;
    font-family: Arial, sans-serif;
  }
  .calc {
    background: #2b2b3d;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #display {
    width: 100%;
    height: 60px;
    font-size: 28px;
    text-align: right;
    border: none;
    border-radius: 8px;
    margin-bottom: 12px;
    padding: 0 12px;
    box-sizing: border-box;
    background: #14141f;
    color: #fff;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 60px);
    gap: 8px;
  }
  button {
    height: 60px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #3f3f56;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #55557a; }
  button.op { background: #ff9500; }
  button.op:hover { background: #ffb143; }
  button.eq { background: #34c759; grid-column: span 2; }
  button.eq:hover { background: #5cd97e; }
  button.clear { background: #ff453a; }
  button.clear:hover { background: #ff7066; }
</style>
</head>
<body>
  <div class="calc">
    <input id="display" type="text" disabled value="0">
    <div class="grid">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="op" onclick="append('/')">÷</button>
      <button class="op" onclick="append('*')">×</button>
      <button class="op" onclick="append('-')">−</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="op" onclick="append('+')">+</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="backspace()">⌫</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="append('.')">.</button>

      <button onclick="append('0')" style="grid-column: span 2;">0</button>
      <button class="eq" onclick="calculate()">=</button>
    </div>
  </div>

<script>
  const display = document.getElementById('display');
  let expression = '';

  function append(value) {
    if (expression === '0') expression = '';
    expression += value;
    display.value = expression;
  }

  function clearDisplay() {
    expression = '';
    display.value = '0';
  }

  function backspace() {
    expression = expression.slice(0, -1);
    display.value = expression || '0';
  }

  function calculate() {
    try {
      if (!/^[0-9+\-*/.\s]+$/.test(expression)) throw new Error('inválido');
      const result = Function('"use strict"; return (' + expression + ')')();
      display.value = result;
      expression = String(result);
    } catch (e) {
      display.value = 'Erro';
      expression = '';
    }
  }
</script>
</body>
</html>
